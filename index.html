<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Pro Billing Cycle</title>

<style>
  /* ── Tokens ─────────────────────────────────────────────────────────
     Coral accent, warm-biased neutrals. Dark is the native look;
     light is designed, not inverted. */
  :root {
    --surface:    #ffffff;
    --surface-2:  #faf7f6;
    --hairline:   #ebe3e0;
    --ink:        #21252c;
    --muted:      #7d736e;
    --accent:     #ce5138;
    --accent-dim: #e08a76;
    --track:      #f0e7e4;
    --shadow:     0 1px 2px rgba(60, 36, 30, .06), 0 8px 24px -12px rgba(60, 36, 30, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface:    #1b1f28;
      --surface-2:  #20252f;
      --hairline:   #2b303b;
      --ink:        #eceef2;
      --muted:      #7b8391;
      --accent:     #ef806b;
      --accent-dim: #a85a4b;
      --track:      #2d323e;
      --shadow:     none;
    }
  }
  :root[data-theme="light"] {
    --surface: #ffffff; --surface-2: #faf7f6; --hairline: #ebe3e0;
    --ink: #21252c; --muted: #7d736e; --accent: #ce5138;
    --accent-dim: #e08a76; --track: #f0e7e4;
    --shadow: 0 1px 2px rgba(60,36,30,.06), 0 8px 24px -12px rgba(60,36,30,.16);
  }
  :root[data-theme="dark"] {
    --surface: #1b1f28; --surface-2: #20252f; --hairline: #2b303b;
    --ink: #eceef2; --muted: #7b8391; --accent: #ef806b;
    --accent-dim: #a85a4b; --track: #2d323e; --shadow: none;
  }

  /* Transparent page so the tile sits on Notion's own background. */
  body {
    margin: 0;
    padding: 10px;
    background: transparent;
    font-family: Georgia, "Iowan Old Style", "Source Serif Pro", "Times New Roman", serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .tile {
    max-width: 760px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-top: 2px solid var(--accent);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ── Header ── */
  .head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface-2);
  }
  .bolt { flex: none; color: var(--accent); display: block; }
  .title {
    flex: 1 1 auto;
    margin: 0;
    font-size: 1.0625rem;
    font-weight: 700;
    letter-spacing: -.005em;
    text-wrap: balance;
  }
  .badge {
    flex: none;
    padding: 5px 11px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: .75rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .badge[data-state="urgent"] { color: var(--accent); border-color: var(--accent-dim); }

  /* ── Body ── */
  .body { display: flex; flex-direction: column; gap: 14px; padding: 20px; }

  .track {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: var(--accent);
    transition: width .7s cubic-bezier(.22, 1, .36, 1);
  }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }

  .scale {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-size: .8125rem;
    font-variant-numeric: tabular-nums;
  }

  .readout {
    display: flex;
    align-items: flex-end;
    gap: 28px;
    padding-top: 2px;
  }
  .stats { display: flex; gap: 28px; flex: 1 1 auto; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat .n {
    font-size: 2.125rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .stat.is-lead .n { color: var(--accent); }
  .stat .k {
    font-size: .6875rem;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    text-align: right;
  }
  .renews { color: var(--muted); font-size: .9375rem; font-variant-numeric: tabular-nums; }

  select {
    appearance: none;
    padding: 4px 26px 4px 10px;
    border: 1px solid var(--hairline);
    border-radius: 7px;
    background: var(--surface-2);
    color: var(--muted);
    font: inherit;
    font-size: .8125rem;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    background-image:
      linear-gradient(45deg, transparent 50%, currentColor 50%),
      linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 12px center, right 7px center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  select:hover { color: var(--ink); }
  :is(select):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 460px) {
    .readout { flex-direction: column; align-items: stretch; gap: 16px; }
    .meta { align-items: flex-start; text-align: left; }
    .stat .n { font-size: 1.875rem; }
  }
</style>

<div class="tile">
  <header class="head">
    <svg class="bolt" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M13 2 4.5 13.5H11l-1 8.5L19.5 10H13z" />
    </svg>
    <h1 class="title">Claude Pro Billing Cycle</h1>
    <span class="badge" id="badge">—</span>
  </header>

  <div class="body">
    <div class="track"><div class="fill" id="fill"></div></div>

    <div class="scale">
      <span id="scaleLeft">—</span>
      <span id="scaleRight">—</span>
    </div>

    <div class="readout">
      <div class="stats">
        <div class="stat is-lead">
          <span class="n" id="usedN">—</span>
          <span class="k">Days used</span>
        </div>
        <div class="stat">
          <span class="n" id="leftN">—</span>
          <span class="k">Days left</span>
        </div>
      </div>
      <div class="meta">
        <span class="renews" id="renews">—</span>
        <select id="picker" aria-label="Billing cycle"></select>
      </div>
    </div>
  </div>
</div>

<script>
  // ── Config ────────────────────────────────────────────────────────────
  // Fallback renewal day, used when nothing else is set. Set your real one
  // per-embed with ?day=15 in the URL — that keeps your billing date in your
  // own Notion page rather than in this repo. Once seen, it's remembered.
  const DEFAULT_ANCHOR_DAY = 1;

  const params = new URLSearchParams(location.search);
  const KEY = 'claude-billing-cycle-tile';

  // ── Theme override: append ?theme=dark or ?theme=light to the embed URL.
  const themeParam = params.get('theme');
  if (themeParam === 'dark' || themeParam === 'light') {
    document.documentElement.dataset.theme = themeParam;
  }

  // Day of the month the subscription renews on. If a month is too short
  // (February, say), it clamps to that month's last day.
  const ANCHOR_DAY = (() => {
    const fromUrl = parseInt(params.get('day'), 10);
    if (Number.isInteger(fromUrl) && fromUrl >= 1 && fromUrl <= 31) {
      try { localStorage.setItem(KEY, String(fromUrl)); } catch { /* blocked */ }
      return fromUrl;
    }
    let stored = NaN;
    try { stored = parseInt(localStorage.getItem(KEY), 10); } catch { /* blocked */ }
    return Number.isInteger(stored) && stored >= 1 && stored <= 31
      ? stored
      : DEFAULT_ANCHOR_DAY;
  })();

  const DAY = 86400000;
  // Noon anchoring keeps day arithmetic immune to daylight-saving shifts.
  const noon = (y, m, d) => new Date(y, m, d, 12, 0, 0, 0);
  const lastDayOf = (y, m) => new Date(y, m + 1, 0).getDate();
  const startOf = (y, m) => noon(y, m, Math.min(ANCHOR_DAY, lastDayOf(y, m)));
  const daysBetween = (a, b) => Math.round((b - a) / DAY);

  const fmt = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' });
  const fmtFull = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric' });

  // The cycle containing `date`, shifted by `offset` whole cycles.
  function cycle(date, offset = 0) {
    let y = date.getFullYear(), m = date.getMonth();
    if (date < startOf(y, m)) m -= 1;         // still in last month's cycle
    m += offset;
    const start = startOf(y, m);
    const next = startOf(start.getFullYear(), start.getMonth() + 1);
    return {
      start,
      next,
      // Renewal lands the day before the next cycle opens.
      renewal: new Date(next - DAY),
      total: daysBetween(start, next) - 1
    };
  }

  const picker = document.getElementById('picker');
  const OFFSETS = [-3, -2, -1, 0, 1, 2];

  function render() {
    const now = new Date();
    const today = noon(now.getFullYear(), now.getMonth(), now.getDate());
    const c = cycle(today, Number(picker.value));

    const elapsed = daysBetween(c.start, today);
    const used = Math.max(0, Math.min(elapsed, c.total));
    const left = c.total - used;
    const pct = c.total > 0 ? (used / c.total) * 100 : 0;

    document.getElementById('fill').style.width = pct.toFixed(2) + '%';
    document.getElementById('usedN').textContent = used + 'd';
    document.getElementById('leftN').textContent = left + 'd';
    document.getElementById('scaleLeft').textContent = `Day ${used} of ${c.total}`;
    document.getElementById('scaleRight').textContent =
      left === 0 ? 'Renews today' : `${left} day${left === 1 ? '' : 's'} left`;
    document.getElementById('renews').textContent = 'Renews ' + fmtFull.format(c.renewal);

    const badge = document.getElementById('badge');
    if (elapsed < 0)            { badge.textContent = 'Upcoming';  badge.dataset.state = ''; }
    else if (elapsed > c.total) { badge.textContent = 'Complete';  badge.dataset.state = ''; }
    else                        { badge.textContent = left + 'd left'; badge.dataset.state = left <= 3 ? 'urgent' : ''; }
  }

  // Build the cycle picker once, then render.
  const base = new Date();
  const baseNoon = noon(base.getFullYear(), base.getMonth(), base.getDate());
  picker.innerHTML = OFFSETS.map(o => {
    const c = cycle(baseNoon, o);
    return `<option value="${o}"${o === 0 ? ' selected' : ''}>` +
           `${fmt.format(c.start)} – ${fmt.format(c.renewal)}</option>`;
  }).join('');
  picker.addEventListener('change', render);
  render();

  // Keep the tile honest if the embed is left open across midnight.
  setInterval(render, 60000);
</script>
