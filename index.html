<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Pro Billing Cycle</title>

<style>
  /* ── Tokens ─────────────────────────────────────────────────────────
     Coral accent, warm-biased neutrals. Dark is the native look;
     light is designed, not inverted. */
  :root {
    --surface:    #ffffff;
    --surface-2:  #faf7f6;
    --hairline:   #ebe3e0;
    --ink:        #21252c;
    --muted:      #7d736e;
    --faint:      #c4bab5;
    --accent:     #ce5138;
    --accent-dim: #e08a76;
    --on-accent:  #ffffff;
    --track:      #f0e7e4;
    --shadow:     0 1px 2px rgba(60, 36, 30, .06), 0 8px 24px -12px rgba(60, 36, 30, .16);
    --pop-shadow: 0 4px 12px rgba(60, 36, 30, .10), 0 18px 40px -16px rgba(60, 36, 30, .30);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface:    #1b1f28;
      --surface-2:  #20252f;
      --hairline:   #2b303b;
      --ink:        #eceef2;
      --muted:      #7b8391;
      --faint:      #4a5160;
      --accent:     #ef806b;
      --accent-dim: #a85a4b;
      --on-accent:  #1b1f28;
      --track:      #2d323e;
      --shadow:     none;
      --pop-shadow: 0 18px 44px -12px rgba(0, 0, 0, .7);
    }
  }
  :root[data-theme="light"] {
    --surface: #ffffff; --surface-2: #faf7f6; --hairline: #ebe3e0;
    --ink: #21252c; --muted: #7d736e; --faint: #c4bab5;
    --accent: #ce5138; --accent-dim: #e08a76; --on-accent: #ffffff; --track: #f0e7e4;
    --shadow: 0 1px 2px rgba(60,36,30,.06), 0 8px 24px -12px rgba(60,36,30,.16);
    --pop-shadow: 0 4px 12px rgba(60,36,30,.10), 0 18px 40px -16px rgba(60,36,30,.30);
  }
  :root[data-theme="dark"] {
    --surface: #1b1f28; --surface-2: #20252f; --hairline: #2b303b;
    --ink: #eceef2; --muted: #7b8391; --faint: #4a5160;
    --accent: #ef806b; --accent-dim: #a85a4b; --on-accent: #1b1f28; --track: #2d323e;
    --shadow: none; --pop-shadow: 0 18px 44px -12px rgba(0, 0, 0, .7);
  }

  /* Triple-click background modes. These must come after the theme rules —
     same specificity, so source order decides. */
  :root[data-bg="solid"] { --surface: #161616; --surface-2: #161616; --on-accent: #161616; }
  :root[data-bg="clear"] { --surface: transparent; --surface-2: transparent; }
  :root[data-bg] .badge { background: transparent; }
  /* Solid mode fills the whole embed, not just the card, so the block reads
     as one dark panel rather than a card floating on Notion's background. */
  :root[data-bg="solid"] body { background: #161616; }
  /* The popover always needs an opaque ground of its own, or the calendar
     renders on top of whatever is behind the tile. */
  :root[data-bg="clear"] .pop { background: #1b1f28; }
  :root[data-bg="clear"][data-scheme="light"] .pop { background: #ffffff; }

  /* Transparent page so the tile sits on Notion's own background. */
  body {
    margin: 0;
    padding: 10px;
    background: transparent;
    font-family: Georgia, "Iowan Old Style", "Source Serif Pro", "Times New Roman", serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .tile {
    max-width: 760px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-top: 2px solid var(--accent);
    border-radius: 12px;
    box-shadow: var(--shadow);
    /* Not `overflow: hidden` — that would clip the calendar popover. The
       header rounds its own top corners instead. */
  }

  /* ── Header ── */
  .head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface-2);
    border-radius: 11px 11px 0 0;
  }
  .bolt { flex: none; color: var(--accent); display: block; }
  .title {
    flex: 1 1 auto;
    margin: 0;
    font-size: 1.0625rem;
    font-weight: 700;
    letter-spacing: -.005em;
    text-wrap: balance;
  }
  .badge {
    flex: none;
    padding: 5px 11px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: .75rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .badge[data-state="urgent"] { color: var(--accent); border-color: var(--accent-dim); }

  /* ── Body ── */
  .body { display: flex; flex-direction: column; gap: 14px; padding: 20px; }

  .track {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: var(--accent);
    transition: width .7s cubic-bezier(.22, 1, .36, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
    .pop { animation: none !important; }
  }

  .scale {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-size: .8125rem;
    font-variant-numeric: tabular-nums;
  }

  .readout {
    display: flex;
    align-items: flex-end;
    gap: 28px;
    padding-top: 2px;
  }
  .stats { display: flex; gap: 28px; flex: 1 1 auto; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat .n {
    font-size: 2.125rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .stat.is-lead .n { color: var(--accent); }
  .stat .k {
    font-size: .6875rem;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    text-align: right;
  }
  .renews { color: var(--muted); font-size: .9375rem; font-variant-numeric: tabular-nums; }

  /* ── Trigger ── */
  .picker { position: relative; }
  .trigger {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    border: 1px solid var(--hairline);
    border-radius: 7px;
    background: var(--surface-2);
    color: var(--muted);
    font: inherit;
    font-size: .8125rem;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .trigger:hover { color: var(--ink); border-color: var(--accent-dim); }
  .trigger[aria-expanded="true"] { color: var(--ink); border-color: var(--accent); }
  .trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .trigger .chev { flex: none; transition: transform .18s ease; }
  .trigger[aria-expanded="true"] .chev { transform: rotate(180deg); }

  /* ── Calendar popover ── */
  .pop {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 20;
    padding: 16px;
    border: 1px solid var(--hairline);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: var(--pop-shadow);
    text-align: left;
    animation: popin .16s cubic-bezier(.22, 1, .36, 1);
  }
  .pop[hidden] { display: none; }
  @keyframes popin {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }

  .pop-head {
    display: grid;
    grid-template-columns: auto 1fr 1fr auto;
    align-items: center;
    gap: 0 20px;
    margin-bottom: 12px;
  }
  .nav {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  .nav:hover { background: var(--surface-2); color: var(--ink); }
  .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mname {
    text-align: center;
    font-size: .9375rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .pop-body { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid { display: grid; grid-template-columns: repeat(7, 30px); gap: 2px; }
  .dow {
    height: 26px;
    display: grid;
    place-items: center;
    font-size: .625rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .dow.end { color: var(--accent-dim); }

  .d {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: .8125rem;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .d.past { color: var(--faint); }
  .d:hover { background: var(--track); }
  /* Days in the committed cycle. */
  .d.in { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .d.in:hover { background: var(--accent); }
  /* A range being picked but not yet committed — lighter, so it reads as
     provisional next to the solid "in" fill of a saved cycle. */
  .d.pick { background: var(--accent-dim); color: var(--on-accent); }
  .d.pick:hover { background: var(--accent-dim); }
  .d.pick-start { box-shadow: inset 0 0 0 1.5px var(--surface); }
  .d.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .d.pick-start.today { box-shadow: inset 0 0 0 1.5px var(--surface), inset 0 0 0 3px var(--accent); }
  .d:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .pop-note {
    margin: 12px 0 0;
    padding-top: 10px;
    border-top: 1px solid var(--hairline);
    color: var(--muted);
    font-size: .75rem;
  }

  @media (max-width: 620px) {
    .pop-head { grid-template-columns: auto 1fr auto; }
    .pop-body { grid-template-columns: 1fr; }
    .mname.second, .cal.second { display: none; }
  }
  @media (max-width: 460px) {
    .readout { flex-direction: column; align-items: stretch; gap: 16px; }
    .meta { align-items: flex-start; text-align: left; }
    .stat .n { font-size: 1.875rem; }
    .pop { right: auto; left: 0; }
  }
</style>

<div class="tile">
  <header class="head">
    <svg class="bolt" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M13 2 4.5 13.5H11l-1 8.5L19.5 10H13z" />
    </svg>
    <h1 class="title">Claude Pro Billing Cycle</h1>
    <span class="badge" id="badge">—</span>
  </header>

  <div class="body">
    <div class="track"><div class="fill" id="fill"></div></div>

    <div class="scale">
      <span id="scaleLeft">—</span>
      <span id="scaleRight">—</span>
    </div>

    <div class="readout">
      <div class="stats">
        <div class="stat is-lead">
          <span class="n" id="usedN">—</span>
          <span class="k">Days used</span>
        </div>
        <div class="stat">
          <span class="n" id="leftN">—</span>
          <span class="k">Days left</span>
        </div>
      </div>

      <div class="meta">
        <span class="renews" id="renews">—</span>
        <div class="picker">
          <button class="trigger" id="trigger" type="button"
                  aria-haspopup="dialog" aria-expanded="false" aria-controls="pop">
            <span id="triggerLabel">—</span>
            <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="3" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </button>

          <div class="pop" id="pop" hidden role="dialog" aria-label="Choose your billing cycle">
            <div class="pop-head">
              <button class="nav" id="calPrev" type="button" aria-label="Previous month">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
              </button>
              <div class="mname" id="mnameA"></div>
              <div class="mname second" id="mnameB"></div>
              <button class="nav" id="calNext" type="button" aria-label="Next month">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
              </button>
            </div>
            <div class="pop-body">
              <div class="cal" id="calA"></div>
              <div class="cal second" id="calB"></div>
            </div>
            <p class="pop-note" id="popNote"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ── Config ────────────────────────────────────────────────────────────
  // Fallback renewal day, used when nothing else is set. Set your real one
  // per-embed with ?day=15 in the URL, or ?start=2026-07-05&end=2026-08-03
  // for a custom-length cycle — either way that keeps your billing dates in
  // your own Notion page rather than in this repo.
  const DEFAULT_ANCHOR_DAY = 1;

  const params = new URLSearchParams(location.search);
  const KEY = 'claude-billing-cycle-tile';

  // ── Theme override: append ?theme=dark or ?theme=light to the embed URL.
  const themeParam = params.get('theme');
  if (themeParam === 'dark' || themeParam === 'light') {
    document.documentElement.dataset.theme = themeParam;
  }

  const DAY = 86400000;
  // Noon anchoring keeps day arithmetic immune to daylight-saving shifts.
  const noon = (y, m, d) => new Date(y, m, d, 12, 0, 0, 0);
  const lastDayOf = (y, m) => new Date(y, m + 1, 0).getDate();
  const daysBetween = (a, b) => Math.round((b - a) / DAY);
  const isoOf = (d) =>
    d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  function parseISODate(str) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
    if (!m) return null;
    const y = +m[1], mo = +m[2] - 1, d = +m[3];
    const dt = noon(y, mo, d);
    return (dt.getFullYear() === y && dt.getMonth() === mo && dt.getDate() === d) ? dt : null;
  }

  // ── Cycle config ──────────────────────────────────────────────────────
  // Two shapes:
  //   { mode: 'day', day }             — renews on the same day every month
  //                                       (variable length: 28–31 days).
  //   { mode: 'range', start, len }    — a fixed-length cycle tiled from an
  //                                       explicit start date, for cycles
  //                                       that don't follow the calendar
  //                                       month. Set by picking two
  //                                       different dates in the calendar.
  function persistConfig(cfg) {
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch { /* blocked */ }
  }

  function loadConfig() {
    const s = params.get('start'), e = params.get('end');
    if (s && e) {
      const sd = parseISODate(s), ed = parseISODate(e);
      if (sd && ed && ed >= sd) {
        const cfg = { mode: 'range', start: isoOf(sd), len: daysBetween(sd, ed) + 1 };
        persistConfig(cfg);
        return cfg;
      }
    }
    const d = parseInt(params.get('day'), 10);
    if (Number.isInteger(d) && d >= 1 && d <= 31) {
      const cfg = { mode: 'day', day: d };
      persistConfig(cfg);
      return cfg;
    }
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch { /* blocked */ }
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        // JSON.parse('30') succeeds and returns the number 30 — it does not
        // throw — so the legacy bare-day-number format has to be checked
        // here, not assumed to fall into the catch below.
        if (typeof parsed === 'number' && parsed >= 1 && parsed <= 31) {
          return { mode: 'day', day: parsed };
        }
        if (parsed?.mode === 'range' && typeof parsed.start === 'string' && parsed.len >= 1) return parsed;
        if (parsed?.mode === 'day' && parsed.day >= 1 && parsed.day <= 31) return parsed;
      } catch {
        // Non-numeric, non-JSON garbage — fall through to the default.
      }
    }
    return { mode: 'day', day: DEFAULT_ANCHOR_DAY };
  }

  let cycleConfig = loadConfig();
  const startOf = (y, m) => noon(y, m, Math.min(cycleConfig.day, lastDayOf(y, m)));

  // The cycle containing `date`.
  function cycle(date) {
    if (cycleConfig.mode === 'range') {
      const rangeStart = parseISODate(cycleConfig.start) || date;
      const len = Math.max(1, cycleConfig.len | 0);
      const offset = Math.floor(daysBetween(rangeStart, date) / len);
      const start = new Date(rangeStart.getTime() + offset * len * DAY);
      const next = new Date(start.getTime() + len * DAY);
      return { start, next, renewal: new Date(next - DAY), total: len - 1 };
    }
    let y = date.getFullYear(), m = date.getMonth();
    if (date < startOf(y, m)) m -= 1;         // still in last month's cycle
    const start = startOf(y, m);
    const next = startOf(start.getFullYear(), start.getMonth() + 1);
    return {
      start,
      next,
      // Renewal lands the day before the next cycle opens.
      renewal: new Date(next - DAY),
      total: daysBetween(start, next) - 1
    };
  }

  const fmt      = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' });
  const fmtFull  = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  const fmtMonth = new Intl.DateTimeFormat(undefined, { month: 'long', year: 'numeric' });
  // Locale-correct weekday initials, starting Sunday.
  const fmtDow = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
  const DOW = Array.from({ length: 7 }, (_, i) => fmtDow.format(new Date(2024, 8, 1 + i)));

  const todayNoon = () => {
    const n = new Date();
    return noon(n.getFullYear(), n.getMonth(), n.getDate());
  };

  // ── Calendar popover ──────────────────────────────────────────────────
  // Click one date, then a second, to set a custom-length cycle running
  // between them — the range previews live as you hover. Click the same
  // date twice instead to fall back to the simple "same day every month"
  // cycle, same as a single click always did before.
  const trigger = document.getElementById('trigger');
  const pop = document.getElementById('pop');
  let viewY, viewM;          // left-hand month currently shown
  let pickStart = null;      // Date | null — set after the first click
  let hoverEnd = null;       // Date | null — live end while hovering

  function pickRange() {
    if (!pickStart) return null;
    const end = hoverEnd || pickStart;
    return pickStart <= end ? [pickStart, end] : [end, pickStart];
  }

  function monthGrid(y, m, today, committed, preview) {
    const lead = new Date(y, m, 1).getDay();
    const count = lastDayOf(y, m);

    let cells = DOW.map((n, i) =>
      `<div class="dow${i === 0 || i === 6 ? ' end' : ''}">${n.slice(0, 2)}</div>`
    ).join('');

    for (let i = 0; i < lead; i++) cells += '<div></div>';

    for (let d = 1; d <= count; d++) {
      const date = noon(y, m, d);
      const cls = ['d'];
      if (preview) {
        if (date >= preview[0] && date <= preview[1]) cls.push('pick');
        if (pickStart && date.getTime() === pickStart.getTime()) cls.push('pick-start');
      } else if (date >= committed.start && date <= committed.renewal) {
        cls.push('in');
      }
      if (date < today) cls.push('past');
      if (date.getTime() === today.getTime()) cls.push('today');
      cells += `<button type="button" class="${cls.join(' ')}" data-iso="${isoOf(date)}" ` +
               `aria-label="${fmtFull.format(date)}">${d}</button>`;
    }
    return `<div class="grid">${cells}</div>`;
  }

  function updateNote(committed, preview) {
    const note = document.getElementById('popNote');
    if (preview) {
      if (hoverEnd && hoverEnd.getTime() !== pickStart.getTime()) {
        const days = daysBetween(preview[0], preview[1]) + 1;
        note.textContent =
          `${fmtFull.format(preview[0])} – ${fmtFull.format(preview[1])} · ${days} days · click to set this custom cycle`;
      } else {
        note.textContent =
          `Start: ${fmtFull.format(pickStart)} · click an end date for a custom cycle, ` +
          `or click this date again to renew on day ${pickStart.getDate()} every month`;
      }
    } else if (cycleConfig.mode === 'range') {
      note.textContent =
        `Custom ${committed.total + 1}-day cycle from ${fmtFull.format(committed.start)} · click a date to change it`;
    } else {
      note.textContent = `Renews on day ${cycleConfig.day} of each month · click a date to change it`;
    }
  }

  function renderCal() {
    const today = todayNoon();
    const committed = cycle(today);
    const preview = pickRange();
    const bY = viewM === 11 ? viewY + 1 : viewY;
    const bM = (viewM + 1) % 12;

    document.getElementById('mnameA').textContent = fmtMonth.format(new Date(viewY, viewM, 1));
    document.getElementById('mnameB').textContent = fmtMonth.format(new Date(bY, bM, 1));
    document.getElementById('calA').innerHTML = monthGrid(viewY, viewM, today, committed, preview);
    document.getElementById('calB').innerHTML = monthGrid(bY, bM, today, committed, preview);
    updateNote(committed, preview);
  }

  function openPop() {
    pickStart = null;
    hoverEnd = null;
    const c = cycle(todayNoon());
    viewY = c.start.getFullYear();
    viewM = c.start.getMonth();
    renderCal();
    pop.hidden = false;
    trigger.setAttribute('aria-expanded', 'true');
  }

  function closePop() {
    pickStart = null;
    hoverEnd = null;
    pop.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
  }

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    pop.hidden ? openPop() : closePop();
  });

  document.getElementById('calPrev').addEventListener('click', () => {
    if (--viewM < 0) { viewM = 11; viewY--; }
    renderCal();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    if (++viewM > 11) { viewM = 0; viewY++; }
    renderCal();
  });

  pop.addEventListener('click', (e) => {
    // Must stop here, before any rerender: renderCal() replaces the grid's
    // innerHTML synchronously, which detaches e.target from the DOM mid-
    // bubble. The document-level outside-click-closer would then see
    // e.target.closest('.picker') return null on the now-detached node and
    // incorrectly treat this as an outside click.
    e.stopPropagation();
    const cell = e.target.closest('.d');
    if (!cell) return;
    const date = parseISODate(cell.dataset.iso);
    if (!date) return;

    if (!pickStart) {
      pickStart = date;
      hoverEnd = date;
      renderCal();
      return;
    }

    cycleConfig = date.getTime() === pickStart.getTime()
      ? { mode: 'day', day: date.getDate() }
      : (() => {
          const [start, end] = date < pickStart ? [date, pickStart] : [pickStart, date];
          return { mode: 'range', start: isoOf(start), len: daysBetween(start, end) + 1 };
        })();

    persistConfig(cycleConfig);
    pickStart = null;
    hoverEnd = null;
    render();
    renderCal();
    closePop();
  });

  pop.addEventListener('mouseover', (e) => {
    if (!pickStart) return;
    const cell = e.target.closest('.d');
    if (!cell) return;
    const date = parseISODate(cell.dataset.iso);
    if (!date || (hoverEnd && date.getTime() === hoverEnd.getTime())) return;
    hoverEnd = date;
    renderCal();
  });

  document.addEventListener('click', (e) => {
    if (!pop.hidden && !e.target.closest('.picker')) closePop();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || pop.hidden) return;
    if (pickStart) { pickStart = null; hoverEnd = null; renderCal(); }
    else { closePop(); trigger.focus(); }
  });

  // ── Render ────────────────────────────────────────────────────────────
  function render() {
    const today = todayNoon();
    const c = cycle(today);

    const elapsed = daysBetween(c.start, today);
    const used = Math.max(0, Math.min(elapsed, c.total));
    const left = c.total - used;
    const pct = c.total > 0 ? (used / c.total) * 100 : 0;

    document.getElementById('fill').style.width = pct.toFixed(2) + '%';
    document.getElementById('usedN').textContent = used + 'd';
    document.getElementById('leftN').textContent = left + 'd';
    document.getElementById('scaleLeft').textContent = `Day ${used} of ${c.total}`;
    document.getElementById('scaleRight').textContent =
      left === 0 ? 'Renews today' : `${left} day${left === 1 ? '' : 's'} left`;
    document.getElementById('renews').textContent = 'Renews ' + fmtFull.format(c.renewal);
    document.getElementById('triggerLabel').textContent =
      `${fmt.format(c.start)} – ${fmt.format(c.renewal)}`;

    const badge = document.getElementById('badge');
    badge.textContent = left + 'd left';
    badge.dataset.state = left <= 3 ? 'urgent' : '';
  }

  render();

  // ── Triple-click to cycle the background ──────────────────────────────
  // Theme default → solid #161616 → transparent → back.
  const BG_KEY = KEY + ':bg';
  const BG_MODES = ['', 'solid', 'clear'];
  const baseTheme = document.documentElement.dataset.theme || '';

  let bgMode = '';
  try { bgMode = localStorage.getItem(BG_KEY) || ''; } catch { /* blocked */ }
  if (!BG_MODES.includes(bgMode)) bgMode = '';

  function applyBg() {
    const root = document.documentElement;
    if (bgMode) {
      root.dataset.bg = bgMode;
      // Solid lays down its own near-black ground, so it pins the dark
      // palette. Transparent shows whatever is behind it, so it must keep
      // following the viewer's theme or the text can land on its own colour.
      if (bgMode === 'solid') root.dataset.theme = 'dark';
      else if (baseTheme) root.dataset.theme = baseTheme;
      else delete root.dataset.theme;
    } else {
      delete root.dataset.bg;
      if (baseTheme) root.dataset.theme = baseTheme;
      else delete root.dataset.theme;
    }
    // The popover needs an opaque ground even in transparent mode, so it has
    // to know which way the ambient scheme is leaning.
    root.dataset.scheme = (root.dataset.theme === 'dark') ? 'dark'
      : (root.dataset.theme === 'light') ? 'light'
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  applyBg();

  document.addEventListener('click', (e) => {
    if (e.detail !== 3) return;                             // triple-click only
    if (e.target.closest('input, select, button, .pop')) return;
    bgMode = BG_MODES[(BG_MODES.indexOf(bgMode) + 1) % BG_MODES.length];
    try { localStorage.setItem(BG_KEY, bgMode); } catch { /* blocked */ }
    applyBg();
    // Drop the text selection the triple-click just made.
    window.getSelection()?.removeAllRanges();
  });

  // Keep the tile honest if the embed is left open across midnight.
  setInterval(render, 60000);
</script>
