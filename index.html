<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Pro Billing Cycle</title>

<style>
  /* ── Tokens ─────────────────────────────────────────────────────────
     Coral accent, warm-biased neutrals. Dark is the native look;
     light is designed, not inverted. */
  :root {
    --surface:    #ffffff;
    --surface-2:  #faf7f6;
    --hairline:   #ebe3e0;
    --ink:        #21252c;
    --muted:      #7d736e;
    --faint:      #c4bab5;
    --accent:     #ce5138;
    --accent-dim: #e08a76;
    --on-accent:  #ffffff;
    --tint:       #f7e2dc;
    --shadow:     0 1px 2px rgba(60, 36, 30, .06), 0 8px 24px -12px rgba(60, 36, 30, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface:    #1b1f28;
      --surface-2:  #20252f;
      --hairline:   #2b303b;
      --ink:        #eceef2;
      --muted:      #7b8391;
      --faint:      #4a5160;
      --accent:     #ef806b;
      --accent-dim: #a85a4b;
      --on-accent:  #1b1f28;
      --tint:       #38282a;
      --shadow:     none;
    }
  }
  :root[data-theme="light"] {
    --surface: #ffffff; --surface-2: #faf7f6; --hairline: #ebe3e0;
    --ink: #21252c; --muted: #7d736e; --faint: #c4bab5;
    --accent: #ce5138; --accent-dim: #e08a76; --on-accent: #ffffff; --tint: #f7e2dc;
    --shadow: 0 1px 2px rgba(60,36,30,.06), 0 8px 24px -12px rgba(60,36,30,.16);
  }
  :root[data-theme="dark"] {
    --surface: #1b1f28; --surface-2: #20252f; --hairline: #2b303b;
    --ink: #eceef2; --muted: #7b8391; --faint: #4a5160;
    --accent: #ef806b; --accent-dim: #a85a4b; --on-accent: #1b1f28; --tint: #38282a;
    --shadow: none;
  }

  /* Transparent page so the tile sits on Notion's own background. */
  body {
    margin: 0;
    padding: 10px;
    background: transparent;
    font-family: Georgia, "Iowan Old Style", "Source Serif Pro", "Times New Roman", serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .tile {
    max-width: 760px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-top: 2px solid var(--accent);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ── Header ── */
  .head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface-2);
  }
  .bolt { flex: none; color: var(--accent); display: block; }
  .title {
    flex: 1 1 auto;
    margin: 0;
    font-size: 1.0625rem;
    font-weight: 700;
    letter-spacing: -.005em;
  }
  .badge {
    flex: none;
    padding: 5px 11px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: .75rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .badge[data-state="urgent"] { color: var(--accent); border-color: var(--accent-dim); }

  .body { padding: 16px 20px 18px; }

  /* ── Calendar ── */
  .cal {
    display: grid;
    grid-template-columns: auto 1fr 1fr auto;
    align-items: start;
    gap: 0 20px;
  }
  .nav {
    align-self: center;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  .nav:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
  .nav:disabled { color: var(--faint); cursor: default; }
  .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .month { max-width: 268px; margin: 0 auto; width: 100%; }
  .month-name {
    margin: 0 0 12px;
    text-align: center;
    font-size: .9375rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .dow {
    padding-bottom: 6px;
    text-align: center;
    font-size: .625rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .dow.end { color: var(--accent-dim); }

  .day {
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    border-radius: 7px;
    font-size: .8125rem;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
  }
  /* Days still to come in this cycle: solid. */
  .day.in { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  /* Days already passed: outline only. Inset so the cell doesn't shift. */
  .day.used {
    background: transparent;
    color: var(--accent);
    outline: 1.5px solid var(--accent);
    outline-offset: -1.5px;
  }
  .day.today { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent); font-weight: 700; }

  /* ── Footer stats ── */
  .foot {
    display: flex;
    align-items: flex-end;
    gap: 28px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
  }
  .stats { display: flex; gap: 28px; flex: 1 1 auto; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat .n {
    font-size: 1.875rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .stat.is-lead .n { color: var(--accent); }
  .stat .k {
    font-size: .6875rem;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .meta { text-align: right; }
  .renews { color: var(--muted); font-size: .9375rem; font-variant-numeric: tabular-nums; }
  .range { margin-top: 4px; font-size: .8125rem; color: var(--faint); font-variant-numeric: tabular-nums; }

  .controls { margin-top: 14px; }
  .actions, .editor { display: flex; align-items: center; gap: 8px; }
  /* Must come after the rule above: a bare `display: flex` outranks the
     hidden attribute's UA style, which would leave both rows visible. */
  .actions[hidden], .editor[hidden] { display: none; }
  .editor label {
    font-size: .6875rem;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
  }
  button.txt {
    padding: 5px 13px;
    border: 1px solid var(--hairline);
    border-radius: 7px;
    background: var(--surface-2);
    color: var(--muted);
    font: inherit;
    font-size: .8125rem;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  button.txt:hover { color: var(--ink); border-color: var(--accent-dim); }
  button.txt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .editor input {
    width: 5ch;
    padding: 5px 8px;
    border: 1px solid var(--accent-dim);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: .875rem;
    font-variant-numeric: tabular-nums;
  }
  .editor input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .editor input[aria-invalid="true"] { border-color: var(--accent); background: var(--tint); }
  .hint { color: var(--faint); font-size: .75rem; }

  @media (max-width: 560px) {
    .cal { grid-template-columns: auto 1fr auto; }
    .month:last-of-type { display: none; }
    .foot { flex-direction: column; align-items: stretch; gap: 16px; }
    .meta { text-align: left; }
  }
</style>

<div class="tile">
  <header class="head">
    <svg class="bolt" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M13 2 4.5 13.5H11l-1 8.5L19.5 10H13z" />
    </svg>
    <h1 class="title">Claude Pro Billing Cycle</h1>
    <span class="badge" id="badge">—</span>
  </header>

  <div class="body">
    <div class="cal">
      <button class="nav" id="prev" type="button" aria-label="Previous cycle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <div class="month" id="monthA"></div>
      <div class="month" id="monthB"></div>
      <button class="nav" id="next" type="button" aria-label="Next cycle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </div>

    <div class="foot">
      <div class="stats">
        <div class="stat is-lead">
          <span class="n" id="usedN">—</span>
          <span class="k">Days used</span>
        </div>
        <div class="stat">
          <span class="n" id="leftN">—</span>
          <span class="k">Days left</span>
        </div>
      </div>
      <div class="meta">
        <div class="renews" id="renews">—</div>
        <div class="range" id="range">—</div>
      </div>
    </div>

    <div class="controls">
      <div class="actions" id="actions">
        <button type="button" class="txt" id="editDay">Edit billing date</button>
      </div>
      <form class="editor" id="editor" hidden>
        <label for="editorInput">Renews on day</label>
        <input id="editorInput" type="text" inputmode="numeric" autocomplete="off" size="3" />
        <button type="button" class="txt" id="editorSave">Save</button>
        <button type="button" class="txt" id="editorCancel">Cancel</button>
        <span class="hint">of each month</span>
      </form>
    </div>
  </div>
</div>

<script>
  // ── Config ────────────────────────────────────────────────────────────
  // Fallback renewal day, used when nothing else is set. Set your real one
  // per-embed with ?day=15 in the URL — that keeps your billing date in your
  // own Notion page rather than in this repo. Once seen, it's remembered.
  const DEFAULT_ANCHOR_DAY = 1;

  const params = new URLSearchParams(location.search);
  const KEY = 'claude-billing-cycle-tile';

  // ── Theme override: append ?theme=dark or ?theme=light to the embed URL.
  const themeParam = params.get('theme');
  if (themeParam === 'dark' || themeParam === 'light') {
    document.documentElement.dataset.theme = themeParam;
  }

  // Day of the month the subscription renews on. If a month is too short
  // (February, say), it clamps to that month's last day.
  const persistDay = (d) => {
    try { localStorage.setItem(KEY, String(d)); } catch { /* blocked */ }
  };

  let anchorDay = (() => {
    const fromUrl = parseInt(params.get('day'), 10);
    if (Number.isInteger(fromUrl) && fromUrl >= 1 && fromUrl <= 31) {
      persistDay(fromUrl);
      return fromUrl;
    }
    let stored = NaN;
    try { stored = parseInt(localStorage.getItem(KEY), 10); } catch { /* blocked */ }
    return Number.isInteger(stored) && stored >= 1 && stored <= 31
      ? stored
      : DEFAULT_ANCHOR_DAY;
  })();

  const DAY = 86400000;
  // Noon anchoring keeps day arithmetic immune to daylight-saving shifts.
  const noon = (y, m, d) => new Date(y, m, d, 12, 0, 0, 0);
  const lastDayOf = (y, m) => new Date(y, m + 1, 0).getDate();
  const startOf = (y, m) => noon(y, m, Math.min(anchorDay, lastDayOf(y, m)));
  const daysBetween = (a, b) => Math.round((b - a) / DAY);

  const fmtMonth = new Intl.DateTimeFormat(undefined, { month: 'long', year: 'numeric' });
  const fmtShort = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' });
  const fmtFull  = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  // Locale-correct weekday initials, starting Sunday.
  const fmtDow = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
  const DOW = Array.from({ length: 7 }, (_, i) => fmtDow.format(new Date(2024, 8, 1 + i)));

  // The cycle containing `date`, shifted by `offset` whole cycles.
  function cycle(date, offset = 0) {
    let y = date.getFullYear(), m = date.getMonth();
    if (date < startOf(y, m)) m -= 1;          // still in last month's cycle
    m += offset;
    const start = startOf(y, m);
    const next = startOf(start.getFullYear(), start.getMonth() + 1);
    return {
      start,
      // Renewal lands the day before the next cycle opens.
      renewal: new Date(next - DAY),
      total: daysBetween(start, next) - 1
    };
  }

  function monthHtml(y, m, c, today) {
    const lead = new Date(y, m, 1).getDay();   // blanks before the 1st
    const count = lastDayOf(y, m);

    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<div></div>';

    for (let d = 1; d <= count; d++) {
      const date = noon(y, m, d);
      const cls = ['day'];
      if (date >= c.start && date <= c.renewal) {
        cls.push(date <= today ? 'used' : 'in');
      }
      if (date.getTime() === today.getTime()) cls.push('today');
      cells += `<div class="${cls.join(' ')}">${d}</div>`;
    }

    const dow = DOW.map((n, i) =>
      `<div class="dow${i === 0 || i === 6 ? ' end' : ''}">${n.slice(0, 2)}</div>`
    ).join('');

    return `<p class="month-name">${fmtMonth.format(new Date(y, m, 1))}</p>
            <div class="grid">${dow}${cells}</div>`;
  }

  let offset = 0;

  function render() {
    const now = new Date();
    const today = noon(now.getFullYear(), now.getMonth(), now.getDate());
    const c = cycle(today, offset);

    // Always show the cycle's opening month and the one after it — together
    // they cover any cycle, which spans at most two months.
    const a = c.start;
    document.getElementById('monthA').innerHTML =
      monthHtml(a.getFullYear(), a.getMonth(), c, today);
    document.getElementById('monthB').innerHTML =
      monthHtml(a.getFullYear(), a.getMonth() + 1, c, today);

    const elapsed = daysBetween(c.start, today);
    const used = Math.max(0, Math.min(elapsed, c.total));
    const left = c.total - used;

    document.getElementById('usedN').textContent = used + 'd';
    document.getElementById('leftN').textContent = left + 'd';
    document.getElementById('renews').textContent = 'Renews ' + fmtFull.format(c.renewal);
    document.getElementById('range').textContent =
      `${fmtShort.format(c.start)} – ${fmtShort.format(c.renewal)} · ${c.total} days`;

    const badge = document.getElementById('badge');
    if (elapsed < 0)            { badge.textContent = 'Upcoming'; badge.dataset.state = ''; }
    else if (elapsed > c.total) { badge.textContent = 'Complete'; badge.dataset.state = ''; }
    else                        { badge.textContent = left + 'd left'; badge.dataset.state = left <= 3 ? 'urgent' : ''; }

    document.getElementById('prev').disabled = offset <= -12;
    document.getElementById('next').disabled = offset >= 12;
  }

  document.getElementById('prev').addEventListener('click', () => { offset--; render(); });
  document.getElementById('next').addEventListener('click', () => { offset++; render(); });

  // ── Editing the renewal day ───────────────────────────────────────────
  // Inline rather than prompt(): Notion renders embeds in a sandboxed iframe,
  // where prompt() and alert() are blocked outright.
  const actions = document.getElementById('actions');
  const editor = document.getElementById('editor');
  const editorInput = document.getElementById('editorInput');
  let editing = false;

  function openEditor() {
    editing = true;
    editorInput.value = String(anchorDay);
    editorInput.removeAttribute('aria-invalid');
    actions.hidden = true;
    editor.hidden = false;
    editorInput.focus();
    editorInput.select();
  }

  function closeEditor() {
    editing = false;
    editor.hidden = true;
    actions.hidden = false;
  }

  function commit() {
    if (!editing) return;
    const v = parseInt(editorInput.value.replace(/[^0-9]/g, ''), 10);
    if (!Number.isInteger(v) || v < 1 || v > 31) {
      editorInput.setAttribute('aria-invalid', 'true');
      editorInput.focus();
      editorInput.select();
      return;
    }
    anchorDay = v;
    persistDay(v);
    offset = 0;               // a new anchor means a different current cycle
    closeEditor();
    render();
  }

  // Save is a plain button wired directly rather than a submit button: the
  // commit path shouldn't depend on native form submission firing.
  document.getElementById('editDay').addEventListener('click', openEditor);
  document.getElementById('editorSave').addEventListener('click', commit);
  document.getElementById('editorCancel').addEventListener('click', closeEditor);
  editor.addEventListener('submit', (e) => { e.preventDefault(); commit(); });
  editorInput.addEventListener('input', () => editorInput.removeAttribute('aria-invalid'));
  editorInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter')  { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
  });

  render();
  // Keep the tile honest if the embed is left open across midnight.
  setInterval(render, 60000);
</script>
